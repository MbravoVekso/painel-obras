<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- MODELO PAINEL - R01 (26/11/2026): visual no Vekso Design System R01, logos Vekso e Benx, gráficos em SVG próprio
     (sem biblioteca de fora) com ampliar, rótulos, zoom, legenda clicável, ver dados e salvar imagem.
     R00 (25/11/2026): protótipo com tela de senha. O gerador troca o marcador do cofre pelo dado cifrado. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Painel de obras Vekso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
 --fundo:#161616; --superficie:#1E1E24; --superficie-destaque:#23232A;
 --linha:rgba(255,255,255,.10); --linha-forte:rgba(255,255,255,.16);
 --texto:#FFFEFB; --texto-apoio:#999EA6;
 --destaque:#F6C945; --sobre-destaque:#1E1E24; --destaque-suave:rgba(246,201,69,.07);
 --verde:#4EC38A; --vermelho:#E5605A; --azul:#6B86C6; --barra-navegacao:rgba(22,22,22,.88);
 --p-rgb:246,201,69; --p-hot:255,254,251; --p-dot-a:.85; --p-line-a:.3; --p-hot-a:.55;
 --raio-marcador:2px; --raio-botao:8px; --raio-cartao:14px; --raio-bloco:16px; --raio-figura:20px; --raio-pilula:999px;
 --fd:'Archivo','Segoe UI',system-ui,sans-serif;
 --fb:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 --fm:'JetBrains Mono',ui-monospace,Consolas,monospace;
 --hair:1px solid var(--linha);
 color-scheme:dark;
}
:root[data-theme="light"]{
 --fundo:#F7F7F3; --superficie:#FFFFFF; --superficie-destaque:#EFEFE9;
 --linha:rgba(0,0,0,.13); --linha-forte:rgba(0,0,0,.16);
 --texto:#1A1A1A; --texto-apoio:#5A5F66;
 --destaque:#9A7400; --sobre-destaque:#FFFFFF;
 --verde:#1E8A5C; --vermelho:#C0392B; --azul:#3B5BA5; --barra-navegacao:rgba(255,255,255,.9);
 --p-rgb:154,116,0; --p-hot:26,26,26; --p-dot-a:.7; --p-line-a:.26; --p-hot-a:.42;
 color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fundo);color:var(--texto);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--destaque);outline-offset:2px}
.mono{font-family:var(--fm)}

/* ---------- entrada ---------- */
#bg{position:fixed;inset:0;z-index:0}
#trava{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
#trava form{width:min(470px,100%);background:var(--superficie);border:var(--hair);border-radius:var(--raio-figura);padding:32px 28px;display:flex;flex-direction:column;gap:14px}
#trava .logo{height:34px;width:auto;align-self:flex-start;margin-bottom:10px}
#trava h1{font:800 1.9rem/1.05 var(--fd);letter-spacing:-.012em;margin:0;text-wrap:balance}
#trava p{margin:0;color:var(--texto-apoio)}
.rotulo{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-apoio)}
.kicker{font-size:.76rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--destaque)}
#trava label{margin-top:6px}
.campo{display:flex;border:1px solid var(--linha-forte);border-radius:var(--raio-botao);background:var(--fundo)}
.campo:focus-within{border-color:var(--destaque)}
.campo input{flex:1;min-width:0;font:400 16px var(--fm);padding:12px 14px;border:0;background:transparent;color:var(--texto);outline:none}
.campo button{border:0;background:transparent;color:var(--texto-apoio);padding:0 12px;cursor:pointer}
.btn{font:700 .95rem var(--fb);background:var(--destaque);color:#161616;border:0;border-radius:var(--raio-botao);padding:13px 16px;cursor:pointer}
:root[data-theme="light"] .btn{background:#F6C945}
.btn:disabled{opacity:.6;cursor:wait}
#erro{color:var(--azul);min-height:1.3em;font-weight:600}
.rodape-trava{font-size:.78rem;color:var(--texto-apoio)}

/* ---------- barra do topo ---------- */
#painel{position:relative;z-index:1}
.barra{position:sticky;top:0;z-index:20;background:var(--barra-navegacao);backdrop-filter:blur(8px);border-bottom:var(--hair)}
.barra .in{margin:0 auto;padding:10px clamp(16px,2.5vw,40px);display:flex;align-items:center;gap:16px}
.barra .logo{height:26px;width:auto}
.barra .sep{width:1px;height:26px;background:var(--linha-forte)}
.benx{height:34px;padding:4px 8px;background:#fff;border-radius:var(--raio-botao);display:flex;align-items:center}
.benx img{height:100%;width:auto}
.barra .acoes{margin-left:auto;display:flex;align-items:center;gap:8px}
.ico{width:38px;height:38px;display:grid;place-items:center;border:var(--hair);border-radius:var(--raio-pilula);background:var(--superficie);cursor:pointer;color:var(--texto-apoio)}
.ico:hover{color:var(--destaque);border-color:var(--destaque)}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tgl{font:600 .8rem var(--fb);color:var(--texto-apoio);background:var(--superficie);border:var(--hair);border-radius:var(--raio-pilula);padding:8px 16px;cursor:pointer;white-space:nowrap}
.tgl:hover,.tgl[aria-pressed="true"]{color:var(--destaque);border-color:var(--destaque)}

/* ---------- ficha da obra ---------- */
main{margin:0 auto;padding:24px clamp(16px,2.5vw,40px) 48px}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;align-items:end;padding-bottom:22px;border-bottom:var(--hair)}
.ficha h1{font:800 clamp(2rem,5vw,3.6rem)/1.02 var(--fd);letter-spacing:-.015em;margin:6px 0 10px;text-wrap:balance}
.ficha .meta{font:400 .82rem var(--fm);color:var(--texto-apoio);display:flex;flex-wrap:wrap;gap:4px 18px}
.ficha .meta b{color:var(--texto);font-weight:600}
.mesref{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mesref select{font:600 1.05rem var(--fm);background:var(--superficie);color:var(--texto);border:1px solid var(--destaque);border-radius:var(--raio-botao);padding:9px 12px;cursor:pointer}
.espaco{height:2px}
.conclusao{font:400 clamp(1.05rem,1.6vw,1.3rem)/1.4 var(--fb);margin:20px 0 4px;max-width:62ch;text-wrap:balance}
.conclusao b{font-weight:700;color:var(--destaque)}
@media(max-width:720px){.ficha{grid-template-columns:1fr}}

/* ---------- abas ---------- */
nav.abas{display:flex;gap:6px;margin:22px 0 18px;flex-wrap:wrap}
nav.abas button{font:700 .78rem var(--fb);letter-spacing:.1em;text-transform:uppercase;background:transparent;border:var(--hair);border-radius:var(--raio-pilula);color:var(--texto-apoio);padding:9px 18px;cursor:pointer}
nav.abas button[aria-selected="true"]{background:var(--destaque);border-color:var(--destaque);color:#161616}
:root[data-theme="light"] nav.abas button[aria-selected="true"]{color:#fff}

/* ---------- grade ---------- */
.grade{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1000px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.fig{background:var(--superficie);border:var(--hair);border-radius:var(--raio-figura);padding:18px 18px 14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.fig header{display:flex;align-items:center;gap:10px}
.fig h2{font:700 .8rem var(--fb);text-transform:uppercase;letter-spacing:.1em;color:var(--destaque);margin:0;flex:1}
.fig .sub{font-size:.78rem;color:var(--texto-apoio);margin:-6px 0 0}
.mini{font:600 .72rem var(--fb);color:var(--texto-apoio);background:transparent;border:var(--hair);border-radius:var(--raio-pilula);padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.mini:hover,.mini[aria-pressed="true"]{color:var(--destaque);border-color:var(--destaque)}
.mini svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.graf{height:clamp(300px,34vh,520px);width:100%;cursor:zoom-in}
.graf.baixo{height:240px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--texto-apoio)}
.leg i{display:inline-block;width:7px;height:7px;border-radius:var(--raio-marcador);margin-right:6px;vertical-align:1px}

/* cartões de valor */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.trio{gap:8px}.c{padding:10px}.c .n{font-size:1.15rem}.c .l{font-size:.6rem;letter-spacing:.06em}}
.c{background:var(--fundo);border:var(--hair);border-radius:var(--raio-cartao);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.c.hl{border-color:var(--destaque);background:var(--superficie-destaque)}
.c .l{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-apoio);font-weight:600}
.c .n{font:800 clamp(1.4rem,2.2vw,1.9rem)/1.1 var(--fd);color:var(--texto);font-variant-numeric:tabular-nums}
.c.hl .n{color:var(--destaque)}
.c .n.bom{color:var(--verde)}.c .n.ruim{color:var(--vermelho)}
.c .f{font-size:.76rem;color:var(--texto-apoio)}

/* régua de prazo */
.regua{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.linha-prazo{display:grid;grid-template-columns:96px minmax(0,1fr) 112px;gap:12px;align-items:center}
.linha-prazo .nome{font:600 .8rem var(--fb)}
.linha-prazo .trilho{position:relative;height:14px;border-radius:var(--raio-marcador);background:var(--fundo);border:var(--hair)}
.linha-prazo .trilho i{position:absolute;top:-1px;bottom:-1px;border-radius:var(--raio-marcador)}
.linha-prazo .data{font:600 .9rem var(--fm);text-align:right}
.eixo{position:relative;height:22px;margin-left:108px;margin-right:124px;font:400 .7rem var(--fm);color:var(--texto-apoio)}
.eixo span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marco{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--texto)}
.regua .nota{font-size:.82rem;color:var(--texto-apoio)}
.regua .nota b{color:var(--texto)}
@media(max-width:560px){.linha-prazo{grid-template-columns:70px minmax(0,1fr) 92px}.eixo{margin-left:82px;margin-right:104px}}

/* tabelas */
.rolagem{overflow:auto;max-height:440px}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-apoio);font-weight:600;text-align:left;padding:8px 10px;border-bottom:var(--hair);position:sticky;top:0;background:var(--superficie)}
.tbl td{padding:7px 10px;border-bottom:var(--hair)}
.tbl .r{text-align:right;font-family:var(--fm);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.ref td{color:var(--destaque);font-weight:600}
.pill{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:var(--raio-pilula);border:1px solid var(--destaque);color:var(--destaque);white-space:nowrap}
.pill.b{border-color:var(--azul);color:var(--azul)}
.pill.v{border-color:var(--verde);color:var(--verde)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros input{font:400 .85rem var(--fb);background:var(--fundo);color:var(--texto);border:var(--hair);border-radius:var(--raio-pilula);padding:7px 14px;min-width:0;flex:1 1 180px}
.fonte{font-size:.76rem;color:var(--texto-apoio);margin-top:26px}

/* ampliado */
#amplia{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.72);display:grid;place-items:center;padding:16px}
:root[data-theme="light"] #amplia{background:rgba(40,40,40,.45)}
#amplia{grid-template-columns:minmax(0,1fr)}
#amplia .caixa{justify-self:center;min-width:0;width:min(1840px,100%);height:min(1040px,calc(100vh - 32px));background:var(--superficie);border:var(--hair);border-radius:var(--raio-figura);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#amplia header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#amplia h2{font:800 1.3rem var(--fd);margin:0 auto 0 0}
#ampliaGraf{flex:1;min-height:0}
#ampliaDados{flex:1;min-height:0;overflow:auto}
.gtip{position:absolute;z-index:5;pointer-events:none;background:var(--superficie-destaque);border:1px solid var(--linha-forte);border-radius:var(--raio-botao);padding:8px 10px;font-size:.78rem;color:var(--texto);min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gtip strong{display:block;font:600 .8rem var(--fm);margin-bottom:4px}
.gtip div{display:flex;gap:6px;align-items:center;white-space:nowrap}.gtip div span{flex:1;color:var(--texto-apoio)}.gtip b{font:600 .78rem var(--fm);margin-left:10px}
.gtip i{width:8px;height:8px;border-radius:2px;display:inline-block}
#gContr{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.contr{display:flex;height:28px;border-radius:var(--raio-botao);overflow:hidden}
.contr span{display:flex;align-items:center;justify-content:center;font:600 .78rem var(--fm);color:#161616;min-width:0}
#ampliaZoom{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--texto-apoio)}
#ampliaZoom[hidden]{display:none}
.ls{font:400 .8rem var(--fb);color:var(--texto-apoio);background:none;border:0;padding:2px 0;cursor:pointer}
.ls[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.leg .dica{font-size:.72rem;opacity:.7;margin-left:auto}
#ampliaZoom label{display:flex;gap:8px;align-items:center;flex:1 1 200px}
#ampliaZoom input{flex:1;accent-color:var(--destaque)}
#zTxt{font:600 .8rem var(--fm);color:var(--texto);white-space:pre}
@media (prefers-reduced-motion:no-preference){.fig,.c{transition:border-color .15s}}
@media print{#bg,.barra .acoes,.mini,#amplia{display:none!important}}
</style>
</head>

/* ---------- tema ---------- */
const raiz=document.documentElement;
function lerTema(){try{return localStorage.getItem("painel-tema")}catch(e){return null}}
if(lerTema()==="light")raiz.setAttribute("data-theme","light");
function aplicarLogo(){const c=raiz.getAttribute("data-theme")==="light";document.querySelectorAll("img.vk").forEach(i=>i.src=c?LOGO_CLARO:LOGO_ESCURO);window.recolorirFundo&&window.recolorirFundo()}
aplicarLogo();

/* ---------- malha de partículas (Vekso Design System), só na entrada ---------- */
(function(){
  const cv=document.getElementById("bg");
  if(!cv||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=cv.getContext("2d");let BG,PONTO,LRGB,LA,HRGB,HA;
  function lerCores(){const cs=getComputedStyle(raiz),g=n=>cs.getPropertyValue(n).trim();BG=g("--fundo");PONTO="rgba("+g("--p-rgb")+","+g("--p-dot-a")+")";LRGB=g("--p-rgb");LA=parseFloat(g("--p-line-a"));HRGB=g("--p-hot");HA=parseFloat(g("--p-hot-a"))}
  window.recolorirFundo=lerCores;lerCores();
  const mouse={x:null,y:null,r:230},LINK=168,LINK2=LINK*LINK;let W=0,H=0,pts=[],raf=0,ativo=true;
  function build(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(Math.round(W*H/11000),210);pts=[];for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.36,vy:(Math.random()-.5)*.36,s:Math.random()*1.7+.9})}
  function frame(){if(!ativo)return;raf=requestAnimationFrame(frame);ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
    for(const p of pts){if(p.x>W||p.x<0)p.vx=-p.vx;if(p.y>H||p.y<0)p.vy=-p.vy;
      if(mouse.x!==null){const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);if(d>0&&d<mouse.r+p.s){const f=(mouse.r-d)/mouse.r*3.4;p.x-=dx/d*f;p.y-=dy/d*f}}
      p.x+=p.vx;p.y+=p.vy;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fillStyle=PONTO;ctx.fill()}
    ctx.lineWidth=1;
    for(let a=0;a<pts.length;a++){const near=mouse.x!==null&&Math.hypot(pts[a].x-mouse.x,pts[a].y-mouse.y)<mouse.r;
      for(let b=a+1;b<pts.length;b++){const ux=pts[a].x-pts[b].x,uy=pts[a].y-pts[b].y,q=ux*ux+uy*uy;if(q>LINK2)continue;const op=1-q/LINK2;
        ctx.strokeStyle=near?"rgba("+HRGB+","+(op*HA)+")":"rgba("+LRGB+","+(op*LA)+")";ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke()}}}
  addEventListener("resize",build);addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener("mouseout",()=>{mouse.x=mouse.y=null});
  document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else if(ativo)frame()});
  window.pararFundo=()=>{ativo=false;cancelAnimationFrame(raf);cv.hidden=true};
  build();frame();

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const pw=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveBits"]);
  for(const c of COFRE.obras){
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(c.sal),iterations:COFRE.iter},pw,512));
    const iv=b64(c.iv),ct=b64(c.dado),msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
    const kMac=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
    if(!await crypto.subtle.verify("HMAC",kMac,b64(c.mac),msg))continue;
    const kAes=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
    const gz=await crypto.subtle.decrypt({name:"AES-CBC",iv},kAes,ct);
    return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  }
  return null;
}

    <div class="c"><span class="l">Eficiência</span><span class="n ${cls(efa)}">${pct(efa,1)}</span><span class="f">acumulada</span></div>`;

  // prazo
  const P=D.proj.find(r=>r[0]===ref)||[];
  const linhasP=[["Baseline",P[1],P[4],cDest],["Desafio",P[2],P[5],cMeta],["Projeção",P[3],P[6],cAzul]];
  const LP=linhasP.filter(l=>l[1]&&l[2]),ok=P.length&&LP.length;
  if(ok){
    const ini=Math.min(...LP.map(l=>dia(l[1]))),fim=Math.max(...LP.map(l=>dia(l[2])));

      <span class="data">${dbr(b)}</span></div>`).join("")+
      `<div class="eixo">${anos.map(y=>`<span style="left:${pos(Date.UTC(y,0,1))}%">${y}</span>`).join("")}<span style="left:${marcoRef}%;top:12px;color:var(--texto)">▲ ${ml(ref)}</span></div>
      <p class="nota">Início em ${dbr(P[1])}.${dv!=null&&db!=null?` Projeção de término ${txt(dv,"Desafio")} e ${txt(db,"Baseline")}.`:""}</p>`;
  } else $("#regua").innerHTML=`<p class="nota">Sem datas de projeção para ${ml(ref)}.</p>`;

  // suprimentos
  const sp=D.sp.filter(r=>r[0]===ref),tot=sp.reduce((a,r)=>a+(r[2]||0),0),cont=sp.reduce((a,r)=>a+(r[6]||0),0);
  const cs=D.cs.filter(r=>r[0]===ref).sort((a,b)=>a[1]<b[1]?-1:1),csB=acum(cs,2),csR=acum(cs,3),ic=cs.findIndex(r=>r[1]===ref);
  const prev=csB[ic],real2=tot?cont/tot:null,des=real2!=null&&prev!=null?real2-prev:null;
  $("#kSup").innerHTML=`<div class="c"><span class="l">Previsto</span><span class="n">${pct(prev,1)}</span><span class="f">até ${ml(ref)}</span></div>
    <div class="c"><span class="l">Contratado</span><span class="n ${des==null?"":des>=-1e-9?"bom":"ruim"}">${pct(real2,1)}</span><span class="f">${brlK(cont)}</span></div>
    <div class="c"><span class="l">Desvio</span><span class="n ${des==null?"":des>=-1e-9?"bom":"ruim"}">${des==null?"-":(Math.abs(des)<5e-4?"0,0":(des>0?"+":"")+num(des*100,1))+" pp"}</span><span class="f">pontos percentuais</span></div>`;

  // ---- definições dos gráficos ----
  const w5=S.map((r,i)=>i).filter(i=>i>=idx-1&&i<=idx+3);
  G.g5={titulo:"Andamento físico mês a mês",sub:`De ${ml(S[w5[0]]?.[1]||ref)} a ${ml(S[w5[w5.length-1]]?.[1]||ref)}: barras mensais, linha acumulada`,tipo:true,zoom:false,
    leg:()=>[["Baseline",cDest],["Desafio",cMeta],["Real / projeção",cAzul],["Acumulado real",cAzul]],
    opt:on=>Object.assign(base(),{xAxis:eixoX(w5.map(i=>ml(S[i][1]))),yAxis:[eixoY(),eixoY({position:"right",splitLine:{show:false}})],
      series:[barra("Baseline",w5.map(i=>S[i][2]*100),cDest,on),barra("Desafio",w5.map(i=>S[i][3]*100),cMeta,on),barra("Real / projeção",w5.map(i=>S[i][4]*100),cAzul,on),
        linha("Acumulado real",w5.map(i=>aR[i]*100),cAzul,on,{yAxisID:undefined,yAxisIndex:1,_fixo:true})],
      tooltip:Object.assign(base().tooltip,{valueFormatter:v=>num(v,2)+"%"})}),
    dados:()=>[["Mês","Baseline","Desafio","Real/proj.","Acum. real"],w5.map(i=>[ml(S[i][1]),pct(S[i][2]),pct(S[i][3]),pct(S[i][4]),pct(aR[i])])]};

  G.gSup={titulo:"Cronograma de suprimentos",sub:"Acumulado previsto x contratado",tipo:true,zoom:true,
    leg:()=>[["Previsto",cMeta],["Contratado",cDest]],
    opt:on=>{const w=cs.map((r,i)=>i).filter(i=>i>=ic-3&&i<=ic+3);return Object.assign(base(),{xAxis:eixoX(w.map(i=>ml(cs[i][1]))),yAxis:eixoY({max:100}),
      series:[linha("Previsto",w.map(i=>csB[i]*100),cMeta,on),linha("Contratado",w.map(i=>i<=ic?csR[i]*100:null),cDest,on)],
      tooltip:Object.assign(base().tooltip,{valueFormatter:v=>v==null?"-":num(v,1)+"%"})})},
    dados:()=>[["Mês","Previsto acum.","Contratado acum."],cs.map((r,i)=>[ml(r[1]),pct(csB[i],1),i<=ic?pct(csR[i],1):"-"])]};
  G.gCS=Object.assign({},G.gSup,{titulo:"Cronograma de suprimentos completo",sub:"Acumulado previsto x contratado, todos os meses",
    opt:on=>Object.assign(base(),{xAxis:eixoX(cs.map(r=>ml(r[1]))),yAxis:eixoY({max:100}),
      series:[linha("Previsto",csB.map(v=>v*100),cMeta,on,{symbolSize:4}),linha("Contratado",cs.map((r,i)=>i<=ic?csR[i]*100:null),cDest,on,{symbolSize:4})],
      tooltip:Object.assign(base().tooltip,{valueFormatter:v=>v==null?"-":num(v,1)+"%"})})});

  G.gCurva={titulo:"Curva S",sub:`Barras mensais e linhas acumuladas. Referência ${ml(ref)}`,tipo:false,zoom:true,
    leg:()=>[["Mensal baseline",cDest],["Mensal desafio",cMeta],["Mensal real / projeção",cAzul],["Acum. baseline",cDest],["Acum. desafio",cMeta],["Acum. real / projeção",cAzul]],
    opt:on=>Object.assign(base(),{xAxis:eixoX(S.map(r=>ml(r[1]))),yAxis:[eixoY(),eixoY({position:"right",max:100,splitLine:{show:false}})],
      series:[barra("Mensal baseline",S.map(r=>r[2]*100),cDest,on,{barMaxWidth:12}),barra("Mensal desafio",S.map(r=>r[3]*100),cMeta,on,{barMaxWidth:12}),barra("Mensal real / projeção",S.map(r=>r[4]*100),cAzul,on,{barMaxWidth:12,
          markLine:{silent:true,symbol:"none",label:{formatter:ml(ref),color:css("--texto")},lineStyle:{color:css("--texto"),type:"dashed"},data:[{xAxis:ml(ref)}]}}),
        linha("Acum. baseline",aB.map(v=>v*100),cDest,on,{yAxisIndex:1,symbol:"none",_fixo:true}),linha("Acum. desafio",aD.map(v=>v*100),cMeta,on,{yAxisIndex:1,symbol:"none",_fixo:true}),
        linha("Acum. real / projeção",aR.map(v=>v*100),cAzul,on,{yAxisIndex:1,symbol:"none",_fixo:true})],
      tooltip:Object.assign(base().tooltip,{valueFormatter:v=>num(v,2)+"%"})}),
    dados:()=>[["Mês","Mensal baseline","Acum.","Mensal desafio","Acum.","Mensal real/proj.","Acum."],S.map((r,i)=>[ml(r[1]),pct(r[2]),pct(aB[i]),pct(r[3]),pct(aD[i]),pct(r[4]),pct(aR[i])])]};

  const aa=D.aa.filter(r=>r[0]===ref);
  G.gStatus={titulo:"Status por grupo de serviço",sub:"Percentual executado de cada grupo",tipo:false,zoom:true,
    opt:on=>Object.assign(base(),{grid:{left:8,right:40,top:8,bottom:8,containLabel:true},xAxis:eixoY({max:100}),yAxis:{type:"category",inverse:true,data:aa.map(r=>r[1]),axisTick:{show:false},axisLine:{show:false},axisLabel:{color:css("--texto"),fontSize:11,width:150,overflow:"truncate"}},
      series:[{name:"Executado",type:"bar",data:aa.map(r=>Math.min(1,r[2]||0)*100),barMaxWidth:14,showBackground:true,backgroundStyle:{color:css("--linha"),borderRadius:4},
        itemStyle:{color:cAzul,borderRadius:4},label:Object.assign(lab(true,v=>num(v,0)+"%","right"),{color:cAzul})}],tooltip:Object.assign(base().tooltip,{trigger:"item",valueFormatter:v=>num(v,1)+"%"})}),
    dados:()=>[["Grupo","% executado"],aa.map(r=>[r[1],pct(r[2],1)])]};

  const pr=D.proj.filter(r=>r[0]<=ref).sort((a,b)=>a[0]<b[0]?-1:1);
  G.gProj={titulo:"Projeção de término mês a mês",sub:"Data de término prevista em cada mês de referência",tipo:false,zoom:true,
    leg:()=>[["Baseline",cDest],["Desafio",cMeta],["Projeção",cAzul]],
    opt:on=>{const f=v=>dbr(new Date(v).toISOString());const lb=(on2,c)=>Object.assign(lab(on2,f),{formatter:p=>f(p.value),color:c});
      return Object.assign(base(),{xAxis:eixoX(pr.map(r=>ml(r[0]))),yAxis:{type:"value",scale:true,splitLine:{lineStyle:{color:css("--linha")}},axisLabel:{color:css("--texto-apoio"),fontFamily:"JetBrains Mono, monospace",fontSize:11,formatter:v=>{const d=new Date(v);return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+String(d.getUTCFullYear()).slice(2)}}},
      series:[["Baseline",4,cDest],["Desafio",5,cMeta],["Projeção",6,cAzul]].map(([n,i,c])=>Object.assign(linha(n,pr.map(r=>r[i]?dia(r[i]):null),c,on),{label:lb(on,c)})),
      tooltip:Object.assign(base().tooltip,{valueFormatter:v=>v==null?"-":f(v)})})},
    dados:()=>[["Mês ref.","Baseline","Desafio","Projeção"],pr.map(r=>[ml(r[0]),dbr(r[4]),dbr(r[5]),dbr(r[6])])]};

  const abc=sp.filter(r=>r[3]>0).sort((a,b)=>b[3]-a[3]);let sAc=0;const abcA=abc.map(r=>sAc+=r[3]);
  G.gABC={titulo:"Curva ABC de suprimentos",sub:"Peso de cada serviço no orçamento, do maior para o menor. Amarelo: já contratado. Amplie e use o zoom para ler os nomes",tipo:false,zoom:true,
    leg:()=>[["Contratado",cDest],["A contratar",cMeta],["Peso acumulado",css("--texto")]],
    opt:on=>Object.assign(base(),{grid:{left:8,right:8,top:20,bottom:8,containLabel:true},xAxis:eixoX(abc.map(r=>r[1]),{axisLabel:{show:abc.length<=25||!!amp.id,color:css("--texto-apoio"),fontSize:10,rotate:60,interval:amp.id?"auto":0,width:120,overflow:"truncate"}}),
      yAxis:[eixoY(),eixoY({position:"right",max:100,splitLine:{show:false}})],
      series:[["Contratado",true,cDest],["A contratar",false,cMeta]].map(([n,f,c])=>({name:n,type:"bar",stack:"abc",data:abc.map(r=>((r[5]||0)>=1)===f?r[3]*100:null),itemStyle:{color:c,borderRadius:[4,4,0,0]},barMaxWidth:18,label:Object.assign(lab(on,v=>num(v,1)+"%"),{color:c})})).concat([
        linha("Peso acumulado",abcA.map(v=>v*100),css("--texto"),on,{yAxisIndex:1,symbol:"none",label:lab(false)})]),
      tooltip:Object.assign(base().tooltip,{valueFormatter:v=>num(v,2)+"%"})}),
    dados:()=>[["Serviço","Peso","Acumulado","Orçamento","% contratado"],abc.map((r,i)=>[r[1],pct(r[3]),pct(abcA[i]),brl(r[2]),r[5]==null?"-":pct(r[5],0)])]};

  // barra única contratado x a contratar
  const gc=document.getElementById("gContr");
  const pc=tot?Math.min(1,cont/tot):0;
  gc.innerHTML=`${legenda([["Contratado",cDest],["A contratar",cMeta]])}<div class="contr" role="img" aria-label="Contratado ${pct(pc,0)}"><span style="width:${pc*100}%;background:${cDest}">${pc>=.08?pct(pc,0):""}</span><span style="flex:1;background:${cMeta}">${1-pc>=.08?pct(1-pc,0):""}</span></div>`;

  montarCartoes();desenharTodos();

  // tabela andamento
  let h=`<thead><tr><th>Mês</th><th class="r">Baseline</th><th class="r">Acum.</th><th class="r">Desafio</th><th class="r">Acum.</th><th class="r">Real / proj.</th><th class="r">Acum.</th></tr></thead><tbody>`;
  S.forEach((r,i)=>{h+=`<tr class="${r[1]===ref?"ref":""}"><td>${ml(r[1])}${r[1]===ref?' <span class="pill">referência</span>':""}</td><td class="r">${pct(r[2])}</td><td class="r">${pct(aB[i])}</td><td class="r">${pct(r[3])}</td><td class="r">${pct(aD[i])}</td><td class="r">${pct(r[4])}</td><td class="r">${pct(aR[i])}</td></tr>`});
  $("#tAF").innerHTML=h+"</tbody>";
  const rr=$("#tAF tr.ref");if(rr){const box=rr.closest(".rolagem");box.scrollTop=Math.max(0,rr.offsetTop-box.clientHeight/2)}
  tabelaSup(sp,ref);
}
function tabelaSup(sp,ref){
  sp=sp||D.sp.filter(r=>r[0]===sel.value);ref=ref||sel.value;
  const so=$("#soAtraso").getAttribute("aria-pressed")==="true",q=$("#busca").value.trim().toLowerCase();
  const late=r=>r[4]&&r[4]<=ref&&(r[5]||0)<1;
  let t=`<thead><tr><th>Serviço / material</th><th class="r">Orçamento</th><th class="r">Peso</th><th class="r">Prazo</th><th class="r">Contratado</th><th class="r">A contratar</th><th>Fornecedor</th><th>Situação</th></tr></thead><tbody>`;
  sp.filter(r=>(!so||late(r))&&(!q||String(r[1]).toLowerCase().includes(q)||String(r[8]||"").toLowerCase().includes(q)))
    .sort((a,b)=>(a[4]||"")<(b[4]||"")?-1:1)
    .forEach(r=>{t+=`<tr><td>${esc(r[1])}</td><td class="r">${brl(r[2])}</td><td class="r">${pct(r[3])}</td><td class="r">${r[4]?ml(r[4]):"-"}</td><td class="r">${r[5]==null?"-":pct(r[5],0)}</td><td class="r">${brl(r[7])}</td><td>${esc(r[8]||"")}</td><td>${late(r)?'<span class="pill b">Atrasado</span>':((r[5]||0)>=1?'<span class="pill v">Contratado</span>':"")}</td></tr>`});
  $("#tSup").innerHTML=t+"</tbody>";
}
$("#soAtraso").addEventListener("click",e=>{const b=e.currentTarget;b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");tabelaSup()});
$("#busca").addEventListener("input",()=>tabelaSup());

document.querySelectorAll("nav.abas button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav.abas button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["geral","planejamento","suprimentos"].forEach(v=>$("#v-"+v).hidden=v!==b.dataset.v);
  try{history.replaceState(null,"","#"+b.dataset.v)}catch(e){}
  render();}));
sel.addEventListener("change",render);
$("#tema").addEventListener("click",()=>{const c=raiz.getAttribute("data-theme")==="light";if(c)raiz.removeAttribute("data-theme");else raiz.setAttribute("data-theme","light");
  try{localStorage.setItem("painel-tema",c?"dark":"light")}catch(e){}aplicarLogo();render();if(amp.id)redesenharAmp()});
const h0=(location.hash||"").slice(1),bt=document.querySelector(`nav.abas button[data-v="${h0}"]`);
if(bt)bt.click();else render();
}
</script>
</body>
</html>
